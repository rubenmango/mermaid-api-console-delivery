<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mermaid API — Signing in</title>

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root { --ink:#f2f3f7; --muted:#8585a4; --pink:#e0095f; --pink-hover:#f0217a; --ease:cubic-bezier(.22,1,.36,1); }
@view-transition { navigation: auto; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font-family:Inter,system-ui,sans-serif; background:#0f1a22; color:var(--ink); }
.stage { min-height:100vh; position:relative; overflow:hidden; }
.bg { position:absolute; inset:0; }
.bg img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center bottom; animation: bg-in 1.4s var(--ease) both, bg-zoom 16s ease-out both; }
@keyframes bg-in { from { opacity:0; transform:scale(1.03); } }
@keyframes bg-zoom { from { scale:1; } to { scale:1.05; } }
.logo { position:absolute; left:36px; top:32px; z-index:2; display:inline-flex; align-items:center; gap:8px; color:inherit; text-decoration:none; }
.logo img { width:28px; height:28px; }
.logo span { font-size:20px; font-weight:700; }
.hero { position:relative; z-index:2; padding:22vh 24px 80px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:20px; }
h1 { margin:0; font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:clamp(44px,5vw,64px); line-height:1.1; animation: up .6s var(--ease) both; }
.lede { margin:0; font-size:18px; font-weight:300; animation: up .6s var(--ease) 60ms both; }
.card { width:min(440px,100%); background:rgba(36,35,41,.92); backdrop-filter:blur(8px); border:1px solid #3a3944; border-radius:12px; padding:32px 24px; display:flex; flex-direction:column; gap:16px; margin-top:12px; animation: up .6s var(--ease) 120ms both; view-transition-name: login-card; }
.card.center { align-items:center; }
.card p { margin:0; color:var(--muted); font-size:14px; line-height:1.45; }
.cta { display:inline-flex; align-items:center; justify-content:center; height:36px; border-radius:8px; background:var(--pink); color:#fff; font-weight:500; text-decoration:none; font-size:14px; transition: background .12s ease, transform .12s ease; }
.cta:hover { background:var(--pink-hover); }
.cta:active { transform:scale(.98); }
.cap { margin:0; font-size:12px; color:#5f5d7a; animation: up .6s var(--ease) 180ms both; }
.spin { width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.18); border-top-color:#fff; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes up { from { opacity:0; transform:translateY(8px); } }
.card h2 { margin:0; font-size:18px; font-weight:600; }
.card .dim { color:#8b86c9; }
.bullets { margin:4px 0 0; padding:0 0 0 18px; text-align:left; width:100%; color:var(--ink); font-size:13px; line-height:1.55; }
.bullets li { animation: up .4s var(--ease) both; }
.bullets li:nth-child(1) { animation-delay:.35s; } .bullets li:nth-child(2) { animation-delay:.5s; } .bullets li:nth-child(3) { animation-delay:.65s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:1ms !important; animation-delay:0ms !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" aria-hidden="true"><img src="assets/signup-hero.jpg" alt="" /></div>
  <a class="logo" href="index.html"><img src="assets/mermaid-logo.svg" alt="" /><span>API</span></a>
  <div class="hero">
    <h1>Mermaid API console</h1>
    <p class="lede">Create API keys and manage your usage and credits.</p>
    <section class="card center" aria-live="polite" aria-busy="true">
      <div class="spin" aria-hidden="true"></div>
      <h2>Signing you in…</h2>
      <p class="dim">Redirecting to Mermaid Chart…</p>
      <ul class="bullets">
        <li>Create a key for each app, script or agent</li>
        <li>See credits used per key and endpoint</li>
        <li>Plan allowance is used first, then purchased credits</li>
      </ul>
    </section>
    <script>setTimeout(function () { location.href = "get-started.html"; }, 3600);</script>
  </div>
</div>
</body>
</html>
