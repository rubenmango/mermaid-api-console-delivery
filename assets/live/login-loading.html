<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mermaid API — Signing in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root { --ink:#f2f3f7; --muted:#8585a4; --pink:#e0095f; --pink-hover:#f0217a; --ease:cubic-bezier(.22,1,.36,1); }
@view-transition { navigation: auto; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font-family:Inter,system-ui,sans-serif; background:#0f1a22; color:var(--ink); }
.stage { min-height:100vh; position:relative; overflow:hidden; }
.bg { position:absolute; inset:0; overflow:hidden; transform:scaleX(-1); --side:max(102.6vw, 144.3vh); }
.bg img { position:absolute; left:50%; top:calc(50% - var(--side) * .3739); width:var(--side); height:var(--side); max-width:none; translate:-50% 0; opacity:.99; animation: bg-in 1.4s var(--ease) both, bg-zoom 16s ease-out both; }
@keyframes bg-in { from { opacity:0; transform:scale(1.03); } }
@keyframes bg-zoom { from { scale:1; } to { scale:1.05; } }
.logo { position:absolute; left:36px; top:32px; z-index:2; display:inline-flex; align-items:center; gap:8px; color:inherit; text-decoration:none; }
.logo img { width:28px; height:28px; }
.logo span { font-size:20px; font-weight:700; }
.hero { position:relative; z-index:2; padding:30vh 24px 80px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:20px; }
h1 { margin:0; font-family:"Instrument Serif",Georgia,serif; font-weight:400; font-size:clamp(44px,5vw,64px); line-height:1.1; animation: up .6s var(--ease) both; }
.lede { margin:0; font-size:18px; font-weight:300; animation: up .6s var(--ease) 60ms both; }
.card { width:min(440px,100%); background:rgba(36,35,41,.92); backdrop-filter:blur(8px); border:1px solid #3a3944; border-radius:12px; padding:32px 24px; display:flex; flex-direction:column; gap:16px; margin-top:12px; animation: up .6s var(--ease) 120ms both; view-transition-name: login-card; }
.card.center { align-items:center; }
.card p { margin:0; color:var(--muted); font-size:14px; line-height:1.45; }
.cta { display:inline-flex; align-items:center; justify-content:center; height:36px; border-radius:8px; background:var(--pink); color:#fff; font-weight:500; text-decoration:none; font-size:14px; transition: background .12s ease, transform .12s ease; }
.cta:hover { background:var(--pink-hover); }
.cta:active { transform:scale(.98); }
.cap { margin:0; font-size:12px; color:#5f5d7a; animation: up .6s var(--ease) 180ms both; }
.spin { width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.18); border-top-color:#fff; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes up { from { opacity:0; transform:translateY(8px); } }
.card h2 { margin:0; font-size:18px; font-weight:600; }
.card .dim { color:#8b86c9; }
.bullets { margin:4px 0 0; padding:0 0 0 18px; text-align:left; width:100%; color:var(--ink); font-size:13px; line-height:1.55; }
.bullets li { animation: up .4s var(--ease) both; }
.bullets li:nth-child(1) { animation-delay:.35s; } .bullets li:nth-child(2) { animation-delay:.5s; } .bullets li:nth-child(3) { animation-delay:.65s; }
.stage::after { content:""; position:absolute; inset:0; z-index:1; background:#0a0d10; opacity:0; pointer-events:none; transition:opacity .9s cubic-bezier(.45,0,.55,1); }
.leaving .stage::after { opacity:.6; }
.card { transition: background .9s cubic-bezier(.45,0,.55,1), border-color .9s cubic-bezier(.45,0,.55,1); }
.leaving .card { background:#242329; border-color:#474454; }
.leaving h1, .leaving .lede, .leaving .cap, .leaving .card > * { animation: out .55s cubic-bezier(.45,0,.55,1) forwards; }
@keyframes out { to { opacity:0; transform:translateY(-6px); filter:blur(2px); } }
::view-transition-group(root), ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.7s; animation-timing-function:cubic-bezier(.45,0,.55,1); }
::view-transition-group(login-card) { animation-duration:.7s; animation-timing-function:cubic-bezier(.65,0,.35,1); }
::view-transition-old(login-card), ::view-transition-new(login-card) { animation-duration:.7s; height:100%; object-fit:none; object-position:50% 50%; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:1ms !important; animation-delay:0ms !important; transition-duration:1ms !important; } }

.stage.signin { background:rgba(10,10,10,.9); display:grid; place-items:center; }
.signin .bg img { animation: bg-zoom 16s ease-out both; }
.stage.signin::after { opacity:.6; animation: undim 1.6s cubic-bezier(.45,0,.55,1) .2s forwards; }
@keyframes undim { to { opacity:0; } }
.school { position:absolute; left:50%; top:50%; width:0; height:0; z-index:1; pointer-events:none; }
.jelly { position:absolute; display:flex; align-items:center; justify-content:center; will-change:translate,opacity; animation: jelly-in 2.4s cubic-bezier(.45,0,.55,1) .3s both, drift var(--drift,18s) cubic-bezier(.33,.5,.6,1) forwards; }
.jelly .rot { flex:none; }
.jelly .body { position:relative; transform-origin:50% 12%; will-change:transform; animation: pulse var(--pulse,3.2s) cubic-bezier(.37,0,.63,1) var(--d,0s) infinite; }
.jelly img { position:absolute; inset:0; width:100%; height:100%; display:block; max-width:none; }
.jelly.tiny .body { overflow:clip; }
.jelly.tiny img { width:auto; height:auto; }
.jelly.flip .body { transform:scaleY(-1); animation:none; }
@keyframes jelly-in { from { opacity:0; } }
@keyframes pulse {
  0%, 100% { transform:translateY(0) scale(1,1); }
  35%      { transform:translateY(1px) scale(1.045,.955); }
  70%      { transform:translateY(-3px) scale(.985,1.025); }
}
@keyframes drift {
  from { translate:0 0; }
  to   { translate:var(--dx,2px) var(--dy,-14px); }
}
.bubble { position:absolute; width:2.24px; height:2.24px; animation: rise 7s ease-in infinite; }
.bubble img { position:absolute; inset:-389.51%; width:880%; height:880%; display:block; max-width:none; }
@keyframes rise { 0% { opacity:0; translate:0 0; } 15% { opacity:1; } 100% { opacity:0; translate:3px -90px; } }
.signin .v { position:relative; z-index:2; width:min(440px,calc(100% - 32px)); }
.signin .card { background:#242329; backdrop-filter:none; border-color:#474454; align-items:center; margin:0; text-align:center; }
.signin .card h2 { font-size:20px; font-weight:600; color:var(--ink); }
.signin .card p { color:var(--muted); }
.signin .facts { margin:0; padding:12px 0 0 21px; width:100%; text-align:left; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:normal; color:var(--ink); }
.signin .facts li { animation: up .4s var(--ease) both; }
.signin .facts li:nth-child(1) { animation-delay:.35s; } .signin .facts li:nth-child(2) { animation-delay:.5s; } .signin .facts li:nth-child(3) { animation-delay:.65s; }
@media (prefers-reduced-motion: reduce) { .jelly, .jelly .body, .bubble { animation:none !important; } }
</style>
